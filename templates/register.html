<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Домашняя Аптечка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:480px;">
    <div class="card shadow-sm p-4">
        <h4 class="mb-1">💊 Домашняя Аптечка</h4>
        <p class="text-muted mb-4" style="font-size:.9rem;">Создайте аккаунт</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for m in messages %}
              <div class="alert alert-warning py-2">{{ m }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Логин <span class="text-danger">*</span></label>
                <input type="text" name="username" class="form-control" placeholder="ivan_petrov" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль <span class="text-danger">*</span></label>
                <input type="password" name="password" class="form-control" placeholder="Минимум 6 символов" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.ru">
                <div class="form-text">Для получения уведомлений о просрочке.</div>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-7">
                    <label class="form-label">Дата рождения</label>
                    <input type="date" name="birth_date" class="form-control"
                           min="1950-01-01" max="2010-12-31">
                </div>
                <div class="col-5">
                    <label class="form-label">Пол</label>
                    <select name="gender" class="form-select">
                        <option value="">Не указан</option>
                        <option value="F">Женский</option>
                        <option value="M">Мужской</option>
                    </select>
                </div>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-success">Создать аккаунт</button>
            </div>
        </form>
        <div class="text-center" style="font-size:.9rem;">
            Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
